        function getRandomBrightColor() {
            const r = Math.floor(Math.random() * 140 + 105).toString(16).padStart(2, '0');
            const g = Math.floor(Math.random() * 140 + 105).toString(16).padStart(2, '0');
            const b = Math.floor(Math.random() * 140 + 105).toString(16).padStart(2, '0');
            return `#${r}${g}${b}`;
        }

        function hexToRgba(hex, alpha) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function changeColors(e) {
            if (e) e.stopPropagation();
            colorNormal = getRandomBrightColor();
            colorSide = getRandomBrightColor();
            updateColors();
            showToast("テーマカラーを変更しました");
        }

        function updateColors() {
            document.documentElement.style.setProperty('--color-normal', colorNormal);
            document.documentElement.style.setProperty('--color-side', colorSide);
            if (isCameraOn) {
                document.documentElement.style.setProperty('--bg-black', 'rgba(0,0,0,0)');
                document.documentElement.style.setProperty('--overlay-color', hexToRgba(colorNormal, 0.16));
            } else {
                document.documentElement.style.setProperty('--bg-black', '#000000');
                document.documentElement.style.setProperty('--overlay-color', 'rgba(0,0,0,0)');
            }
        }

        async function toggleCamera(e) {
            if (e) e.stopPropagation();
            const videoObj = document.getElementById('camera-bg');
            const btn = document.getElementById('cam-btn');

            if (isCameraOn) {
                if (videoStream) videoStream.getTracks().forEach(t => t.stop());
                videoObj.srcObject = null;
                videoObj.style.display = 'none';
                isCameraOn = false;
                btn.textContent = "📷 AR OFF";
                btn.classList.remove('active');
                updateColors();
            } else {
                try {
                    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                        throw new Error('no camera api');
                    }
                    videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                    videoObj.srcObject = videoStream;
                    videoObj.style.display = 'block';
                    isCameraOn = true;
                    btn.textContent = "📷 AR ON";
                    btn.classList.add('active');
                    updateColors();
                    showToast("ARモードを起動しました");
                } catch (err) {
                    showToast("カメラを利用できません");
                }
            }
        }

        // ==========================================
        // 6. 自動デモ演奏モーション計算（楽器の仕組み通りに自動操作＆ループ）
        // ==========================================
        function getPetalTargetDeg(idx, cfg) {
            const layer = Math.floor(idx / 4);
            const dir = idx % 4;
            const dirAnglesRad = [-Math.PI / 2, 0, Math.PI / 2, Math.PI];
            const ang = dirAnglesRad[dir];
            const rDeg = MIN_PLAY_RADIUS + (layer + 0.5) * cfg.degPerLayer;
            return {
                x: rDeg * Math.cos(ang),
                y: rDeg * Math.sin(ang),
                r: rDeg
            };
        }

        function stepDemoLoop(now, dt) {
            if (!demoTimeline.length || demoTotalLoopMs <= 0) return;

            const cfg = getScaleConfig();
            const elapsed = now - demoStartTime;

            let demoX = 0;
            let demoY = 0;
            let previewIdx = -1;
            let readoutText = '0° BASE';
            let chargeRatio = 0;

            if (elapsed < DEMO_LEAD_IN_MS) {
                const p = Math.max(0, Math.min(1, elapsed / DEMO_LEAD_IN_MS));
                const ease = 1 - Math.pow(1 - p, 3);
                const firstEv = demoTimeline[0];
                const firstPos = getPetalTargetDeg(firstEv.idx, cfg);
                demoX = firstPos.x * ease;
                demoY = firstPos.y * ease;
                const rTmp = Math.hypot(demoX, demoY);

                if (rTmp < MIN_PLAY_RADIUS) {
                    playState = 'NEUTRAL';
                    previewIdx = -1;
                    readoutText = Math.round(rTmp) === 0 ? '0° BASE' : 'READY';
                    chargeRatio = 0;
                } else {
                    playState = 'AIMING';
                    previewIdx = firstEv.idx;
                    readoutText = cfg.labels[firstEv.idx];
                    chargeRatio = Math.max(0, Math.min(1, (p - 0.35) / 0.65));
                }
            } else {
                const loopTime = elapsed - DEMO_LEAD_IN_MS;
                const cycle = Math.floor(loopTime / demoTotalLoopMs);
                const tInLoop = loopTime % demoTotalLoopMs;

                let curEvIdx = 0;
                for (let i = 0; i < demoTimeline.length; i++) {
                    if (tInLoop >= demoTimeline[i].startMs && tInLoop < demoTimeline[i].endMs) {
                        curEvIdx = i;
                        break;
                    }
                }

                if (demoLastCycle !== cycle || demoLastEventIdx !== curEvIdx) {
                    demoLastCycle = cycle;
                    demoLastEventIdx = curEvIdx;
                    demoTriggeredForEvent = false;
                    demoReleasedForEvent = false;
                }

                const ev = demoTimeline[curEvIdx];
                const localT = tInLoop - ev.startMs;

                if (localT < ev.dur) {
                    const pos = getPetalTargetDeg(ev.idx, cfg);
                    demoX = pos.x;
                    demoY = pos.y;

                    if (!demoTriggeredForEvent) {
                        demoTriggeredForEvent = true;
                        playState = 'LOCKED';
                        lockedIndex = ev.idx;
                        lockedNoteName = cfg.labels[ev.idx];
                        lockedFreq = midiToFreq(cfg.notes[ev.idx]);
                        lockedTime = now;
                        const dynNorm = Math.max(0, Math.min(1, pos.r / 30));
                        triggerLockedNote(lockedFreq, dynNorm, true, 1.0);
                        spawnPetalRipple(lockedIndex);
                    }

                    previewIdx = ev.idx;
                    readoutText = cfg.labels[ev.idx];
                    chargeRatio = 0;
                } else {
                    if (!demoTriggeredForEvent) {
                        demoTriggeredForEvent = true;
                    }
                    if (!demoReleasedForEvent) {
                        demoReleasedForEvent = true;
                        playState = 'NEUTRAL';
                        lockedIndex = -1;
                        lockedNoteName = '';
                        lockedFreq = 0;
                        releaseNote(60);
                    }

                    const gap = Math.max(1, ev.step - ev.dur);
                    const u = Math.max(0, Math.min(1, (localT - ev.dur) / gap));
                    const prevPos = getPetalTargetDeg(ev.idx, cfg);
                    const nextEv = demoTimeline[(curEvIdx + 1) % demoTimeline.length];
                    const nextPos = getPetalTargetDeg(nextEv.idx, cfg);

                    if (u < 0.36) {
                        const p = u / 0.36;
                        const ease = 1 - Math.pow(1 - p, 2);
                        demoX = prevPos.x * (1 - ease);
                        demoY = prevPos.y * (1 - ease);
                    } else if (u < 0.50) {
                        demoX = 0;
                        demoY = 0;
                    } else {
                        const p = (u - 0.50) / 0.50;
                        const ease = 1 - Math.pow(1 - p, 3);
                        demoX = nextPos.x * ease;
                        demoY = nextPos.y * ease;
                    }

                    const rTmp = Math.hypot(demoX, demoY);
                    if (u < 0.50 || rTmp < MIN_PLAY_RADIUS) {
                        playState = 'NEUTRAL';
                        previewIdx = -1;
                        readoutText = Math.round(rTmp) === 0 ? '0° BASE' : 'READY';
                        chargeRatio = 0;
                    } else {
                        playState = 'AIMING';
                        previewIdx = nextEv.idx;
                        readoutText = cfg.labels[nextEv.idx];
                        chargeRatio = Math.max(0, Math.min(1, (u - 0.68) / 0.32));
                    }
                }
            }

            smoothX = demoX;
            smoothY = demoY;
            const instVx = (smoothX - prevX) / dt;
            const instVy = (smoothY - prevY) / dt;
            velX += (instVx - velX) * 0.6;
            velY += (instVy - velY) * 0.6;
            prevX = smoothX;
            prevY = smoothY;

            const velAbs = Math.hypot(velX, velY);
            const rDeg = Math.hypot(smoothX, smoothY);

            updateVisuals(smoothX, smoothY, rDeg, previewIdx, readoutText, velAbs, chargeRatio);
        }

        document.addEventListener('visibilitychange', () => {
            if (document.hidden && appMode === 'demo') {
                releaseNote(100);
            }
        });

        // ==========================================
        // 7. メインループ（通常演奏 & 練習モード共通の2D極座標判定）
        // ==========================================
        function getPetalForCoords(xDeg, yDeg) {
            const cfg = getScaleConfig();
            const rDeg = Math.hypot(xDeg, yDeg);

            const angleDeg = (Math.atan2(yDeg, xDeg) * 180) / Math.PI;

            let dir = 0;
            if (angleDeg >= -135 && angleDeg < -45) dir = 0;      // 上 (UP)
            else if (angleDeg >= -45 && angleDeg < 45) dir = 1;   // 右 (RIGHT)
            else if (angleDeg >= 45 && angleDeg < 135) dir = 2;   // 下 (DOWN)
            else dir = 3;                                         // 左 (LEFT)

            let layer = Math.floor((rDeg - MIN_PLAY_RADIUS) / cfg.degPerLayer);
            layer = Math.max(0, Math.min(cfg.layers - 1, layer));

            if (lastPreviewIdx >= 0 && lastPreviewIdx < cfg.notes.length) {
                const prevLayer = Math.floor(lastPreviewIdx / 4);
                const prevDir = lastPreviewIdx % 4;
                const dirCenters = [-90, 0, 90, 180];
                let dAng = Math.abs(angleDeg - dirCenters[prevDir]);
                if (dAng > 180) dAng = 360 - dAng;
                const prevRStart = MIN_PLAY_RADIUS + prevLayer * cfg.degPerLayer;
                const prevREnd   = prevRStart + cfg.degPerLayer;
                if (dAng < 49 && rDeg >= prevRStart - 0.8 && (prevLayer === cfg.layers - 1 || rDeg <= prevREnd + 0.8)) {
                    dir = prevDir;
                    layer = prevLayer;
                }
            }

            const idx = layer * 4 + dir;
            const midi = cfg.notes[idx];
            return {
                idx,
                dir,
                layer,
                rDeg,
                freq: midiToFreq(midi),
                label: cfg.labels[idx]
            };
        }

        let lastTime = performance.now();

        function loop(now) {
            const dt = Math.min(0.08, Math.max(0.004, (now - lastTime) / 1000));
            lastTime = now;

            if (isStarted) {
                if (appMode === 'demo') {
                    stepDemoLoop(now, dt);
                    requestAnimationFrame(loop);
                    return;
                }

                let rawX = curXDeg - offsetXDeg;
                let rawY = curYDeg - offsetYDeg;
                if (invertAxes) { rawX = -rawX; rawY = -rawY; }

                rawY *= 1.16;

                smoothX += (rawX - smoothX) * 0.44;
                smoothY += (rawY - smoothY) * 0.44;

                const instVx = (smoothX - prevX) / dt;
                const instVy = (smoothY - prevY) / dt;
                velX += (instVx - velX) * 0.48;
                velY += (instVy - velY) * 0.48;
                prevX = smoothX;
                prevY = smoothY;

                const velAbs = Math.hypot(velX, velY);
                const rDeg = Math.hypot(smoothX, smoothY);
                const dynNorm = Math.max(0, Math.min(1, rDeg / 30));

                let previewIdx = -1;
                let readoutText = '0° BASE';
                let chargeRatio = 0;

                if (playState === 'LOCKED') {
                    if (rDeg <= RESET_RADIUS) {
                        playState = 'NEUTRAL';
                        lockedIndex = -1;
                        lockedNoteName = '';
                        lockedFreq = 0;
                        peakAimVel = 0;
                        settleMs = 0;
                        retriggerArmed = false;
                        retriggerSettleMs = 0;
                        releaseNote(velAbs);
                    } else {
                        previewIdx = lockedIndex;
                        readoutText = lockedNoteName;

                        const curPetal = getPetalForCoords(smoothX, smoothY);
                        if (curPetal.idx === lockedIndex && (now - lockedTime) > 260) {
                            if (velAbs > 42) {
                                retriggerArmed = true;
                                retriggerSettleMs = 0;
                            } else if (retriggerArmed && velAbs < 9) {
                                retriggerSettleMs += dt * 1000;
                                chargeRatio = Math.min(1, retriggerSettleMs / 65);
                                if (retriggerSettleMs >= 65) {
                                    retriggerArmed = false;
                                    retriggerSettleMs = 0;
                                    lockedTime = now;
                                    handleManualNoteTrigger(lockedIndex, lockedFreq, dynNorm);
                                }
                            } else {
                                retriggerSettleMs = 0;
                            }
                        } else {
                            retriggerArmed = false;
                            retriggerSettleMs = 0;
                        }
                    }
                } else {
                    if (rDeg < MIN_PLAY_RADIUS) {
                        playState = 'NEUTRAL';
                        peakAimVel = 0;
                        settleMs = 0;
                        previewIdx = -1;
                        lastPreviewIdx = -1;
                        readoutText = Math.round(rDeg) === 0 ? '0° BASE' : 'READY';
                    } else {
                        playState = 'AIMING';
                        const target = getPetalForCoords(smoothX, smoothY);
                        previewIdx = target.idx;
                        lastPreviewIdx = target.idx;
                        readoutText = target.label;

                        if (velAbs > peakAimVel) peakAimVel = velAbs;

                        const isSlowed = peakAimVel >= 24 ? (velAbs < 14) : (velAbs < 8.5);
                        if (isSlowed) {
                            settleMs += dt * 1000;
                            const waitMs = peakAimVel >= 24 ? 32 : 95;
                            chargeRatio = Math.min(1, settleMs / waitMs);
                            if (settleMs >= waitMs) {
                                playState = 'LOCKED';
                                lockedIndex = target.idx;
                                lockedNoteName = target.label;
                                lockedFreq = target.freq;
                                lockedTime = now;
                                retriggerArmed = false;
                                retriggerSettleMs = 0;
                                handleManualNoteTrigger(lockedIndex, lockedFreq, dynNorm);
                            }
                        } else {
                            settleMs = 0;
                        }
                    }
                }

                updateVisuals(smoothX, smoothY, rDeg, previewIdx, readoutText, velAbs, chargeRatio);
            }

            requestAnimationFrame(loop);
        }

        function updateVisuals(xDeg, yDeg, rDeg, activeIdx, readoutText, velAbs, chargeRatio) {
            const angleText = document.getElementById('angle-text');
            const noteReadout = document.getElementById('note-readout');
            const statePill = document.getElementById('state-pill');
            const centerHud = document.getElementById('center-hud');

            const bTop = document.getElementById('bubble-top');
            const bBottom = document.getElementById('bubble-bottom');
            const liquidOrb = document.getElementById('liquid-orb');
            const chargeArc = document.getElementById('charge-arc');
            const seaLevel = document.getElementById('sea-level');
            const boardWrap = document.getElementById('orbital-board-wrap');
            const edgeCompass = document.getElementById('edge-compass');
            const baseCircle = document.getElementById('svg-base-circle');

            const dispDeg = Math.round(rDeg);

            angleText.textContent = `${dispDeg}°`;
            noteReadout.textContent = readoutText;

            const accelY = (yDeg - lastYForSpring);
            springVelY += accelY * 1.4;
            springVelY += -0.1 * springY;
            springVelY *= 0.84;
            springY += springVelY;
            lastYForSpring = yDeg;

            seaLevel.style.transform = `translateY(${yDeg * 3.8 + springY}px) rotate(${-xDeg}deg)`;
            document.getElementById('grid').style.transform = `translate(${-xDeg * 2.2}px, ${-yDeg * 2.2}px)`;

            const rPx = rDeg < MIN_PLAY_RADIUS
                ? (rDeg / MIN_PLAY_RADIUS) * (centerRadiusPx * 0.5)
                : centerRadiusPx + 4 + (rDeg - MIN_PLAY_RADIUS) * pxPerDeg;

            const theta = Math.atan2(yDeg, xDeg);
            const rawTargetX = rDeg > 0.05 ? rPx * Math.cos(theta) : 0;
            const rawTargetY = rDeg > 0.05 ? rPx * Math.sin(theta) : 0;

            const maxVisibleX = stageWidth * 0.42;
            const maxVisibleY = stageHeight * 0.40;
            const overflowX = Math.max(0, Math.abs(rawTargetX) - maxVisibleX * 0.72) * Math.sign(rawTargetX);
            const overflowY = Math.max(0, Math.abs(rawTargetY) - maxVisibleY * 0.72) * Math.sign(rawTargetY);
            const desiredPanX = -overflowX * 0.65;
            const desiredPanY = -overflowY * 0.65;

            panX += (desiredPanX - panX) * 0.2;
            panY += (desiredPanY - panY) * 0.2;
            boardWrap.style.transform = `translate(${panX}px, ${panY}px)`;

            const orbX = rawTargetX + panX;
            const orbY = rawTargetY + panY;
            const clampX = Math.max(-maxVisibleX, Math.min(maxVisibleX, orbX));
            const clampY = Math.max(-maxVisibleY, Math.min(maxVisibleY, orbY));
            const isClamped = (Math.abs(orbX - clampX) > 4 || Math.abs(orbY - clampY) > 4);

            const moveAngDeg = (Math.atan2(velY, velX) * 180) / Math.PI;
            const stretch = Math.min(0.18, velAbs / 320);
            const sx = 1 + stretch;
            const sy = 1 - stretch * 0.5;
            const pulse = playState === 'LOCKED' ? Math.sin(performance.now() * 0.022) * 0.035 : 0;

            liquidOrb.style.transform = `translate(${clampX}px, ${clampY}px) rotate(${moveAngDeg}deg) scale(${sx + pulse}, ${sy + pulse})`;

            const gap = dispDeg * 0.9 + Math.pow(dispDeg / 13, 2);
            const ux = rDeg > 0.1 ? Math.cos(theta) : 0;
            const uy = rDeg > 0.1 ? Math.sin(theta) : -1;
            bTop.style.transform    = `translate(${clampX + ux * gap}px, ${clampY + uy * gap}px) scale(${1 - stretch * 0.3})`;
            bBottom.style.transform = `translate(${clampX - ux * gap}px, ${clampY - uy * gap}px) scale(${1 - stretch * 0.3})`;

            const circumference = 276.46;
            chargeArc.style.strokeDashoffset = String(circumference * (1 - chargeRatio));
            chargeArc.style.opacity = chargeRatio > 0.04 ? '0.9' : '0';

            if (isClamped) {
                edgeCompass.style.opacity = '1';
                edgeCompass.style.transform = `translate(${clampX + Math.cos(theta) * 32}px, ${clampY + Math.sin(theta) * 32}px)`;
            } else {
                edgeCompass.style.opacity = '0';
            }

            updateOrbitalHighlight(activeIdx, playState === 'LOCKED');

            const isZero = (dispDeg === 0);
            const isDemo = (appMode === 'demo');

            if (playState === 'NEUTRAL') {
                statePill.textContent = isZero ? '0° SILENT' : 'READY';
                statePill.style.background = hexToRgba(colorNormal, 0.25);
                statePill.style.borderColor = colorNormal;
                centerHud.style.borderColor = isZero ? colorNormal : 'rgba(255,255,255,0.3)';
                document.documentElement.style.setProperty('--active-band-color', colorNormal);
                seaLevel.style.borderTopColor = isZero ? colorNormal : 'rgba(255,255,255,0.45)';
                if (baseCircle) baseCircle.setAttribute('fill', hexToRgba(colorNormal, isZero ? 0.28 : 0.10));

                if (isZero) {
                    document.body.style.backgroundColor = isCameraOn ? hexToRgba(colorNormal, 0.42) : hexToRgba(colorNormal, 0.22);
                    document.documentElement.style.setProperty('--overlay-color', 'rgba(0,0,0,0)');
                    bTop.style.backgroundColor = 'rgba(255,255,255,0.36)';
                    bBottom.style.backgroundColor = 'rgba(255,255,255,0.36)';
                    if (!isZeroReached && !isDemo) {
                        try { if (navigator.vibrate) navigator.vibrate(20); } catch (_) {}
                    }
                    isZeroReached = true;
                } else {
                    document.body.style.backgroundColor = isCameraOn ? 'rgba(0,0,0,0)' : '#000000';
                    if (isCameraOn) document.documentElement.style.setProperty('--overlay-color', hexToRgba(colorNormal, 0.16));
                    bTop.style.backgroundColor = 'rgba(255,255,255,0.18)';
                    bBottom.style.backgroundColor = 'rgba(255,255,255,0.18)';
                    isZeroReached = false;
                }
            } else if (playState === 'AIMING') {
                isZeroReached = false;
                statePill.textContent = 'AIMING (STOP)';
                statePill.style.background = hexToRgba(colorSide, 0.36);
                statePill.style.borderColor = colorSide;
                centerHud.style.borderColor = colorSide;
                document.documentElement.style.setProperty('--active-band-color', colorSide);
                seaLevel.style.borderTopColor = colorSide;
                if (baseCircle) baseCircle.setAttribute('fill', 'rgba(255,255,255,0.04)');
                document.body.style.backgroundColor = isCameraOn ? 'rgba(0,0,0,0)' : '#000000';
                if (isCameraOn) document.documentElement.style.setProperty('--overlay-color', hexToRgba(colorSide, 0.16));
                bTop.style.backgroundColor = 'rgba(255,255,255,0.12)';
                bBottom.style.backgroundColor = 'rgba(255,255,255,0.12)';
            } else {
                isZeroReached = false;
                statePill.textContent = 'FIXED ♪ (0°戻し)';
                statePill.style.background = hexToRgba(colorNormal, 0.48);
                statePill.style.borderColor = colorNormal;
                centerHud.style.borderColor = colorNormal;
                document.documentElement.style.setProperty('--active-band-color', colorNormal);
                seaLevel.style.borderTopColor = colorNormal;
                if (baseCircle) baseCircle.setAttribute('fill', hexToRgba(colorNormal, 0.14));
                document.body.style.backgroundColor = isCameraOn ? 'rgba(0,0,0,0)' : '#02120c';
                if (isCameraOn) document.documentElement.style.setProperty('--overlay-color', hexToRgba(colorNormal, 0.22));
                bTop.style.backgroundColor = hexToRgba(colorNormal, 0.28);
                bBottom.style.backgroundColor = hexToRgba(colorNormal, 0.28);
            }
        }

        function initAppShell() {
            populateSongSelectors();
            syncModeUI();
            updateLayoutOrientation();
            requestAnimationFrame(loop);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initAppShell);
        } else {
            initAppShell();
        }
    </script>
</body>
